plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jirigrill.naturehome'
    compileSdk 34

    defaultConfig {
        applicationId "com.jirigrill.naturehome"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
